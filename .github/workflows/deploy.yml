name: GitHub Actions Build and Deploy

# 触发条件: push 到 master 分支后
on:
  workflow_dispatch:
  push:
    branches:
      - master
    # 只在下列路径变更时触发
    paths:
      - '.github/**'
      - 'docs/**'
      - 'package.json'

# 设置权限
permissions: write-all

# 设置上海时区
env:
  TZ: Asia/Shanghai

# 任务
jobs:
  build-and-deploy:
    # 服务器环境：最新版 ubuntu
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 安装 pnpm 工具
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          # 与本地保持一致的 pnpm 大版本：仓库的 lockfileVersion 为 9.0（pnpm 9+ 格式），
          # pnpm 8 只支持到 6.0，会导致安装失败
          version: 12

      # 设置 node 版本
      - name: Set node version to 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      # 打包静态文件
      - name: Build
        run: pnpm install && pnpm run docs:build

      # - name: Copy files
      #   run: cp README.md ./dist/

      # 部署
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: Deploying to gh-pages from @ ${{ github.sha }} 🚀
          # 指定仓库
          repository-name: zhangjunjie-cn/zhangjunjie-cn.github.io
          # GitHub Pages 读取的分支
          branch: gh-pages
          # 静态文件所在目录
          folder: dist
